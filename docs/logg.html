<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logg</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{font-family:system-ui,-apple-system,segoe ui,roboto,ubuntu; margin:14px;}
    table{width:100%; border-collapse:collapse}
    th,td{border-top:1px solid #e5e7eb; padding:6px 8px; text-align:left}
    h3{font-size:16px}
    .toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
    .toolbar input, .toolbar select, .toolbar button{padding:4px 8px}
    #status{margin-left:8px; color:#555}
  </style>
</head>
<body>
  <div class="toolbar">
    <label>Sjåfør <select id="selDriver"><option value="">Alle</option></select></label>
    <label>Sluttdato <input id="inpDato" type="date"></label>
    <label>Antall dager
      <select id="selDays">
        <option>1</option><option>3</option><option selected>5</option><option>7</option><option>14</option>
      </select>
    </label>
    <button id="btnLoadLogg">Last fra JSONBin</button>
    <button onclick="window.print()">Skriv ut / PDF</button>
    <span id="status"></span>
  </div>

  <div id="logg_container"></div>

  <script src="js/logg.js"></script>
</body>
</html>

<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Brøyterute – Logg (A4)</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; margin:16px}
    .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
    .hdr{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:10px 0 6px}
    .hdr .cell{padding:6px 8px;border:1px solid #ddd;border-radius:8px;background:#fafafa}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid #eee}
    th{background:#f6f7f8;text-align:left}
    @media print{
      .controls{display:none}
      body{margin:0.8cm}
      th,td{padding:6px}
    }
  </style>
</head>
<body>

  <div class="controls">
    <label>Dato <input id="inpDato" type="date"></label>
    <label>Sjåfør
      <select id="selDriver"><option value="">Alle</option></select>
    </label>
    <button id="btnLoadLogg" class="btn">Last fra JSONBin</button>
    <button onclick="window.print()">Skriv ut / PDF</button>
  </div>

  <!-- Overskrift / nøkkelfelt -->
  <div class="hdr">
    <div class="cell"><b>Navn:</b> <span id="hdrName">—</span></div>
    <div class="cell"><b>Måned og år:</b> <span id="hdrMonthYear">—</span></div>
    <div class="cell"><b>Oppstart klokken:</b> <span id="hdrStart">—</span></div>
    <div class="cell"><b>Avsluttet klokken:</b> <span id="hdrEnd">—</span></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Adresse</th>
        <th>Oppgave</th>
        <th>Tid startet</th>
        <th>Tid ferdig</th>
        <th>Benyttet tid</th>
      </tr>
    </thead>
    <tbody id="logg_tbody"></tbody>
  </table>

  <div style="margin-top:10px;color:#6b7280">Brøyting Romerike Trefelling</div>

  <script src="./js/logg.js" defer></script>
</body>
</html>


<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Rapporter</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="appbar">
    <button id="hdr_menu" class="icon-btn" aria-label="Meny">☰</button>
    <div class="appbar-title">Rapporter</div>
  </header>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-header">Meny</div>
    <ul class="drawer-list">
      <li><a href="index.html#work">Under arbeid</a></li>
      <li><a href="index.html#service">Service</a></li>
      <li><a href="index.html#status">Status</a></li>
      <li><a href="tools/kart.html">Brøytekart</a></li>
      <li><a href="reports.html">Rapporter</a></li>
      <li><a href="admin.html">Admin</a></li>
      <li><a href="index.html#work" data-shortcut="diesel">⛽ Diesel</a></li>
      <li><a href="index.html#work" data-shortcut="grus">🪨 Grus</a></li>
      <li><a href="index.html#work" data-shortcut="base">🏠 Base</a></li>
    </ul>
  </aside>
  <div id="drawer_overlay" class="drawer-overlay" aria-hidden="true"></div>

  <main class="wrap" id="reports">
    <div id="container"> </div>
  </main>

  <script>
    // Minimal local-only reports render (reads BRYT_REPORTS if present)
    function loadReports(){
      const el = document.getElementById('container');
      const list = JSON.parse(localStorage.getItem('BRYT_REPORTS')||'[]');
      if (!list.length){ el.innerHTML = '<div class="card">Ingen rapporter enda.</div>'; return; }
      const grouped = list.reduce((acc,r)=>{ const d=(new Date(r.createdAt||r.startedAt)).toLocaleDateString('nb-NO'); (acc[d]=acc[d]||[]).push(r); return acc; },{});
      const keys = Object.keys(grouped).sort((a,b)=> new Date(b)-new Date(a));
      el.innerHTML='';
      keys.forEach(k=>{
        const h = document.createElement('h2'); h.textContent=k; el.appendChild(h);
        grouped[k].forEach(r=>{
          const d = document.createElement('div'); d.className='card';
          const when = new Date(r.createdAt||r.startedAt).toLocaleTimeString('nb-NO');
          const title = r.type || 'rapport';
          d.innerHTML = `<div class="small">${when}</div><div><b>${title}</b></div>`;
          el.appendChild(d);
        });
      });
    }
    document.addEventListener('DOMContentLoaded', loadReports);
  </script>
  <script src="js/app.js"></script>
  <script src="js/nav-shortcuts.js"></script>
  <script src="js/admin-navshortcuts.js"></script>
</body>
</html>

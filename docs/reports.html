<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rapporter</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root{ --sep:#e3e5ea; --surface:#fff; --bg:#f6f7fb; --text:#111 }
    .appbar{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px;
      border-bottom:1px solid var(--sep);
      background:var(--surface);
      position:sticky;
      top:0;
      z-index:2;
    }
    .appbar .btn{
      padding:.5rem .7rem;
      background:#3b82f6;
      color:#fff;
      border:none;
      border-radius:8px;
      font-weight:600;
    }
    .rep{border:1px solid var(--sep);padding:8px;margin:8px;border-radius:8px;background:var(--surface)}
    .filter{display:flex;gap:8px;align-items:center;padding:8px}
    body{background:var(--bg);color:var(--text);font-family:system-ui}
  </style>
</head>
<body>
  <div class="appbar">
    <button class="btn" onclick="goBack()">← Tilbake</button>
    <div class="appbar-title" style="font-weight:600;font-size:1.1rem;">Rapporter</div>
    <div style="margin-left:auto"></div>
  </div>

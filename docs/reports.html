<!doctype html>
<html lang="no">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapporter</title>
<style>body{font-family:system-ui;padding:12px;background:#f6f7fb;color:#111} .rep{border:1px solid #ddd;padding:8px;margin-bottom:8px;border-radius:8px;background:#fff}</style>
</head><body>
<h1>Rapporter</h1>
<p>Viser lagrede rapporter (lokalt og synket til JSONBin når nøkkel er satt i Admin).</p>
<div id="container">Laster…</div>
<script>
function loadReports(){
  const key = 'BRYT_REPORTS';
  const list = JSON.parse(localStorage.getItem(key) || '[]');
  const grouped = list.reduce((acc,r)=>{ const d=new Date(r.createdAt||r.startedAt).toLocaleDateString('nb-NO'); (acc[d]=acc[d]||[]).push(r); return acc; }, {});
  const keys = Object.keys(grouped).sort((a,b)=> new Date(b)-new Date(a));
  const el = document.getElementById('container'); el.innerHTML='';
  if (!keys.length) { el.innerHTML = '<p>Ingen rapporter.</p>'; return; }
  keys.forEach(k=>{
    const h = document.createElement('h2'); h.textContent = k; el.appendChild(h);
    grouped[k].forEach(r=>{
      const d = document.createElement('div'); d.className='rep';
      const when = new Date(r.createdAt || r.startedAt).toLocaleTimeString('nb-NO');
      const title = (r.type==='round') ? ('Runde – ' + (r.lane||'')) : 'Uhell';
      d.innerHTML = `<div><small>${when}</small> <b>${title}</b></div>`;
      if (r.type==='round'){
        const span = document.createElement('div'); span.innerHTML = `Adresser: ${r.count||0}`; d.appendChild(span);
      } else if (r.type==='incident'){
        const t = document.createElement('div'); t.textContent = r.text || ''; d.appendChild(t);
      }
      el.appendChild(d);
    });
  });
}
document.addEventListener('DOMContentLoaded', loadReports);
</script></body></html>

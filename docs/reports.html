<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rapporter</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root{ --sep:#e3e5ea; --surface:#fff; --bg:#f6f7fb; --text:#111 }
    body{background:var(--bg);color:var(--text);font-family:system-ui;margin:0}
    .appbar{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--sep);background:var(--surface);position:sticky;top:0;z-index:10}
    .icon-btn{background:transparent;border:0;font-size:1.3rem;line-height:1;padding:.4rem .6rem;border-radius:8px}
    .icon-btn:active{transform:scale(0.98)}
    .appbar-title{font-weight:600;font-size:1.05rem}
    .rep{border:1px solid var(--sep);padding:8px;margin:8px;border-radius:8px;background:var(--surface)}
    .filter{display:flex;gap:8px;align-items:center;padding:8px}
    /* Drawer */
    .drawer{position:fixed;inset:0 35% 0 0;max-width:320px;background:var(--surface);box-shadow:2px 0 16px rgba(0,0,0,.2);transform:translateX(-100%);transition:transform .2s ease;z-index:20}
    .drawer.open{transform:translateX(0)}
    .drawer-header{padding:12px;border-bottom:1px solid var(--sep);font-weight:600}
    .drawer-list{list-style:none;margin:0;padding:6px 0}
    .drawer-list li a{display:block;padding:10px 12px;text-decoration:none;color:inherit}
    .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s;z-index:15}
    .drawer-overlay.show{opacity:1;pointer-events:auto}
    .dot{width:10px;height:10px;border-radius:50%;background:#c0c4ce;display:inline-block}
    .dot-on{background:#22c55e}
  </style>
</head>
<body>
  <header class="appbar">
    <button id="hdr_menu" class="icon-btn" aria-label="Meny">☰</button>
    <div class="appbar-title">Rapporter</div>
    <div style="margin-left:auto"></div>
    <span id="wl_dot" class="dot dot-off" title="Skjermlås"></span>
  </header>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-header">Meny</div>
    <ul class="drawer-list">
      <li><a href="index.html#work">Under arbeid</a></li>
      <li><a href="index.html#service">Service</a></li>
      <li><a href="index.html#status">Status</a></li>
      <li><a href="tools/kart.html">Brøytekart</a></li>
      <li><a href="reports.html">Rapporter</a></li>
    </ul>
  </aside>
  <div id="drawer_overlay" class="drawer-overlay" aria-hidden="true"></div>

  <div class="filter">
    <label>Vis:
      <select id="flt">
        <option value="all">Alle</option>
        <option value="round">Runde-rapporter</option>
        <option value="incident">Uhell</option>
        <option value="service">Service</option>
      </select>
    </label>
  </div>

  <div id="container" style="padding-bottom:20vh">Laster…</div>

  <script>
    // Minimal drawer controls
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('drawer_overlay');
    document.getElementById('hdr_menu').addEventListener('click', ()=>{ drawer.classList.add('open'); overlay.classList.add('show'); });
    overlay.addEventListener('click', ()=>{ drawer.classList.remove('open'); overlay.classList.remove('show'); });

    function loadReports(){
      const list = JSON.parse(localStorage.getItem('BRYT_REPORTS') || '[]');
      const type = (new URL(location.href)).hash?.replace('#','') || 'all';
      const sel = document.getElementById('flt'); sel.value = type || 'all';
      const filtered = (type && type!=='all') ? list.filter(r=>r.type===type) : list;

      const grouped = filtered.reduce((acc,r)=>{ const d=new Date(r.createdAt||r.startedAt).toLocaleDateString('nb-NO'); (acc[d]=acc[d]||[]).push(r); return acc; }, {});
      const keys = Object.keys(grouped).sort((a,b)=> new Date(b)-new Date(a));

      const el = document.getElementById('container'); el.innerHTML='';
      if (!keys.length) { el.innerHTML = '<p style="padding:12px">Ingen rapporter.</p>'; return; }

      keys.forEach(k=>{
        const h = document.createElement('h2'); h.textContent = k; h.style.padding='0 12px'; el.appendChild(h);
        grouped[k].forEach(r=>{
          const d = document.createElement('div'); d.className='rep';
          const when = new Date(r.createdAt || r.startedAt).toLocaleTimeString('nb-NO');
          const title = (r.type==='round') ? ('Runde – ' + (r.lane||'')) : (r.type==='service'?'Service':'Uhell');
          d.innerHTML = `<div><small>${when}</small> <b>${title}</b></div>`;
          if (r.type==='round'){
            d.insertAdjacentHTML('beforeend', `<div>Adresser: ${r.count||0}</div>`);
          } else if (r.type==='incident'){
            d.insertAdjacentHTML('beforeend', `<div>${(r.text||'')}</div>`);
          } else if (r.type==='service'){
            d.insertAdjacentHTML('beforeend', `<pre style="white-space:pre-wrap">${JSON.stringify(r.data||{},null,2)}</pre>`);
          }
          el.appendChild(d);
        });
      });

      sel.onchange = ()=>{ location.hash = sel.value; loadReports(); };
    }
    document.addEventListener('DOMContentLoaded', loadReports);
  </script>
  <script src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="no">
<head>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brøyterute</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/work.css">
</head>
<body>
  <div data-include="partials/header.html"></div>

  <main class="container">
    <!-- HOME -->
    <section id="home">
      <h1>Hjem</h1>
      <div class="card">Velkommen! Velg i menyen eller gå til <a href="#" data-go="work">Under arbeid</a>.</div>
    </section>

    <!-- UNDER ARBEID -->
    <section id="work" hidden>
      <div class="work-header-row">
        <h1 class="work-title">Under arbeid</h1>
        <div id="wx_row" class="wx-row">
          <img id="wx_icon" alt="vær" width="20" height="20" style="vertical-align:middle;margin-right:6px" />
          <span id="wx_temp">--°</span>
          <span id="wx_desc" class="muted"></span>
        </div>
      </div>

      <div class="work-top" id="wk_top">
        <div class="work-prog"><div class="me" id="b_prog_me" style="width:0%"></div></div>
        <div class="work-caption">
          <div><strong id="b_prog_me_count">0/0</strong> mine • <strong id="b_prog_other_count">0/0</strong> andre</div>
          <div id="b_prog_summary">0 av 0 adresser fullført</div>
        </div>
      </div>

      <div class="card work-card">
        <div class="muted">Nå</div>
        <div id="b_now" class="addr-now">—</div>

        <div class="muted" style="margin-top:8px">Neste</div>
        <div id="b_next" class="addr-next">—</div>

        <div class="btn-grid">
          <button id="act_start" class="btn btn-green">▶️ Start</button>
          <button id="act_done" class="btn btn-dark">✅ Ferdig</button>
          <button id="act_skip" class="btn btn-blue">⏭️ Hopp over</button>
          <button id="act_next" class="btn btn-blue">➡️ Neste</button>
          <button id="act_nav" class="btn btn-blue">🧭 Naviger</button>
          <button id="act_block" class="btn btn-blue">⛔ Ikke mulig</button>
          <button id="btnBroytKart" class="btn btn-teal" style="grid-column:1/-1">🚜 Brøytekart</button>
          <button id="btnUhell" class="btn btn-warn" style="grid-column:1/-1">⚠️ Uhell</button>
        </div>
      </div>
    </section>

    <!-- SERVICE -->
    <section id="service" hidden>
      <h1>Service</h1>
      <div class="card">Registrer uhell/vedlikehold her (placeholder).</div>
    </section>

    <!-- STATUS -->
    <section id="status" hidden>
      <h1>Status</h1>
      <div class="card">Statusvisning (placeholder).</div>
    </section>

    <!-- ADMIN -->
    <section id="admin" hidden>
      <h1>Admin</h1>
      <div class="card">
        <div class="row" style="align-items:flex-end">
          <label class="field">JSONbin BIN ID
            <input id="adm_bin" class="input" placeholder="xxxxxxxxxxxxxxxxxx">
          </label>
          <label class="field">X-Master-Key
            <input id="adm_key" class="input" placeholder="••••••">
          </label>
          <button id="adm_save_cfg" class="btn-ghost">Lagre</button>
          <span id="adm_status" class="muted">Ikke lagret</span>
        </div>
      </div>
    </section>
  </main>

  <div class="footer">Brøyting Romerike Trefelling</div>

  <div data-include="partials/menu.html"></div>

  <script src="js/include-partials.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/app.js"></script>
  <script src="js/work_weather_addon.js"></script>
</body>
</html>

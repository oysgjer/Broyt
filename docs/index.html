
<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Brøyt</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/work.css">
</head>
<body>
  <header class="appbar">
    <button id="hdr_menu" class="icon-btn" aria-label="Meny">☰</button>
    <div class="appbar-title">Brøyt</div>
    <span id="topdot" class="top-dot"></span>
  </header>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-header">Meny</div>
    <ul class="drawer-list">
      <li><a href="index.html#work">Under arbeid</a></li>
      <li><a href="index.html#service">Service</a></li>
      <li><a href="index.html#status">Status</a></li>
      <li><a href="tools/kart.html">Brøytekart</a></li>
      <li><a href="reports.html">Rapporter</a></li>
      <li><a href="admin.html">Admin</a></li>
      <li><a href="index.html#work" data-shortcut="diesel">⛽ Diesel</a></li>
      <li><a href="index.html#work" data-shortcut="grus">🪨 Grus</a></li>
      <li><a href="index.html#work" data-shortcut="base">🏠 Base</a></li>
    </ul>
  </aside>
  <div id="drawer_overlay" class="drawer-overlay" aria-hidden="true"></div>

  <main class="wrap" id="work">
    <div class="card" style="margin-bottom:12px">
      <div class="small">Oppgave: <b id="b_task">Snø</b> • Status: <b id="b_status">Venter</b></div>
      <div class="spacer"></div>
      <div>Nå: <b id="b_now">—</b></div>
      <div>Neste: <b id="b_next">—</b></div>
    </div>

    <div class="work-actions card">
      <div class="work-line">
        <button id="act_start" class="btn btn-green">Start</button>
        <button id="act_done"  class="btn btn-primary">Ferdig</button>
      </div>
      <div class="spacer"></div>
      <div class="work-line">
        <button id="act_skip"  class="btn">Hopp over</button>
        <button id="act_next"  class="btn">Neste</button>
        <button id="act_nav"   class="btn">Naviger</button>
        <button id="act_block" class="btn btn-danger">Blokkert</button>
      </div>
      <div class="spacer"></div>
      <div class="grid2">
        <a class="btn" href="tools/kart.html">🗺️ Brøytekart</a>
        <a class="btn" href="reports.html#incident">⚠️ Uhell</a>
      </div>
      <div class="work-meta small">
        <div id="b_prog_summary">0 av 0 adresser fullført</div>
        <div style="display:flex;height:8px;border-radius:6px;overflow:hidden;border:1px solid var(--sep)">
          <div id="b_prog_me" style="background:#22c55e;width:0%"></div>
          <div id="b_prog_other" style="background:#7c3aed;width:0%"></div>
        </div>
        <div class="small">Mine: <span id="b_prog_me_count">0</span> • Andre: <span id="b_prog_other_count">0</span></div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/nav-shortcuts.js"></script>
  <script src="js/admin-navshortcuts.js"></script>
  <script src="js/Work.js"></script>
</body>
</html>

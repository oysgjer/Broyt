<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brøyting – Romerike Trefelling</title>
  <link rel="stylesheet" href="./styles.css">
  <meta name="theme-color" content="#0b0c10">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">Brøyting</div>
      <nav>
        <button id="tabWork" class="active">Under arbeid</button>
        <button id="tabReports">Rapporter</button>
        <button id="tabSettings">Innstillinger</button>
      </nav>
    </header>
    <main>
      <!-- UNDER ARBEID -->
      <section id="viewWork" class="">
        <div class="card">
          <h3 class="section-title">Vær</h3>
          <div class="kpi">
            <img id="wxIcon" alt="vær" width="48" height="48" src="" />
            <div class="temp" id="wxTemp">--°</div>
            <div>
              <div id="wxDesc">Henter vær…</div>
              <div class="meta" id="wxMeta">-</div>
            </div>
            <span id="offlineBadge" class="badge hidden">Offline lagring</span>
          </div>
        </div>

        <div class="card">
          <h3 class="section-title">Handlinger</h3>
          <div class="grid-btns">
            <button id="act_start">▶️ Start</button>
            <button id="act_done">✅ Ferdig</button>
            <button id="act_skip">⏭️ Hopp over</button>
            <button id="act_next">➡️ Neste</button>
            <button id="act_nav">🧭 Naviger</button>
            <button id="act_block">🚧 Hindring</button>
            <button id="btnBroytKart" class="fullwidth">🚜 Brøytekart</button>
            <button id="btnUhell" class="fullwidth">⚠️ Uhell / Avvik</button>
          </div>
        </div>
      </section>

      <!-- RAPPORTER -->
      <section id="viewReports" class="hidden">
        <div class="card">
          <h3 class="section-title">Ny rapport</h3>
          <div class="row">
            <div>
              <label for="r_date">Dato og tid</label>
              <input id="r_date" type="datetime-local">
            </div>
            <div>
              <label for="r_driver">Sjåfør</label>
              <input id="r_driver" placeholder="Navn">
            </div>
            <div>
              <label for="r_round">Runde</label>
              <input id="r_round" type="number" min="1" placeholder="1">
            </div>
          </div>
          <div class="row">
            <div>
              <label for="r_task">Oppgave</label>
              <select id="r_task">
                <option>Brøyte</option>
                <option>Frese</option>
                <option>Strø</option>
                <option>Brøyte og strø</option>
                <option>Frese og strø</option>
              </select>
            </div>
            <div>
              <label for="r_notes">Notat</label>
              <textarea id="r_notes" rows="3" placeholder="Kort beskrivelse…"></textarea>
            </div>
          </div>
          <div class="flex">
            <button id="btnSaveReport">💾 Lagre til JSONbin</button>
            <button id="btnPdfReport">🧾 Eksporter PDF</button>
          </div>
          <hr>
          <small class="muted">Funfacts (kun på denne siden, ikke i PDF):</small>
          <div id="funfacts" class="funfacts"></div>
        </div>

        <div class="card">
          <h3 class="section-title">Lagrede rapporter</h3>
          <div id="reportList" class="row"></div>
        </div>
      </section>

      <!-- INNSTILLINGER -->
      <section id="viewSettings" class="hidden">
        <div class="card">
          <h3 class="section-title">JSONbin</h3>
          <div class="row">
            <div>
              <label for="binId">BIN ID</label>
              <input id="binId" placeholder="xxxxxxxxxxxxxxxxxx">
            </div>
            <div>
              <label for="masterKey">X-Master-Key</label>
              <input id="masterKey" placeholder="••••••">
            </div>
          </div>
          <div class="flex">
            <button id="btnSaveCfg">Lagre nøkler</button>
            <button id="btnTestCfg">Test tilkobling</button>
            <small id="cfgStatus" class="muted">Ikke testet enda.</small>
          </div>
          <hr>
          <small class="muted">Data lagres sentralt. Ved feil på nett lagres det midlertidig lokalt, og sendes opp senere.</small>
        </div>
      </section>
    </main>
    <div class="footer">Brøyting Romerike Trefelling</div>
  </div>

  <script src="./vendor/jspdf/jspdf.umd.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>

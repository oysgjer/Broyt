<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brøyterute</title>

  <!-- Base CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/work.css">
  <link rel="stylesheet" href="css/reports.css"><!-- ny -->

  <!-- Ikoner / fav -->
  <link rel="icon" href="favicon.ico">

  <style>
    /* Enkel toppnavigasjon */
    .topnav {
      display:flex; gap:10px; padding:10px; border-bottom:1px solid var(--sep);
      background:var(--surface); position:sticky; top:0; z-index:10;
    }
    .topnav a { text-decoration:none; padding:8px 10px; border-radius:8px; border:1px solid #d1d5db; }
    .topnav a:hover { background:#111827; color:#fff; }
    main { padding:12px; max-width:900px; margin:0 auto; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>

  <nav class="topnav">
    <a href="#home">Hjem</a>
    <a href="#work">Under arbeid</a>
    <a href="#status">Status</a>
    <a href="#service">Service</a>
    <a href="#reports">Rapporter</a>
    <a href="#admin">Admin</a>
  </nav>

  <main>

    <!-- HJEM -->
    <section id="home">
      <h1>Hjem</h1>
      <p>Velkommen.</p>
    </section>

    <!-- UNDER ARBEID -->
    <section id="work" hidden>
      <h1>Under arbeid</h1>

      <!-- Progress-kort -->
      <div class="work-top">
        <div class="work-prog">
          <div id="b_prog_me" class="me"></div>
          <div id="b_prog_other" class="other"></div>
        </div>
        <div class="work-caption">
          <span>Mine: <strong id="b_prog_me_count">0</strong></span>
          <span>Andre: <strong id="b_prog_other_count">0</strong></span>
          <span id="b_prog_summary">0 av 0 adresser fullført</span>
        </div>
      </div>

      <!-- Nå/Neste + knapper -->
      <div class="work-card">
        <div class="label-muted">Spor</div>
        <div id="b_task" class="addr-next">—</div>

        <div class="label-muted" style="margin-top:10px;">Nå</div>
        <div id="b_now" class="addr-now">—</div>

        <div class="label-muted" style="margin-top:10px;">Neste</div>
        <div id="b_next" class="addr-next">—</div>

        <div class="label-muted" style="margin-top:12px;">Status</div>
        <div id="b_status" class="addr-next">—</div>

        <!-- knapp-grid (beholdt slik du har den) -->
        <div class="btn-grid" style="margin-top:14px;">
          <button id="act_start" class="btn btn-ok"><span class="ico">▶️</span>Start</button>
          <button id="act_done"  class="btn btn-dark"><span class="ico">✅</span>Ferdig</button>
          <button id="act_skip"  class="btn"><span class="ico">⏭️</span>Hopp over</button>
          <button id="act_next"  class="btn"><span class="ico">➜</span>Neste</button>
          <button id="act_nav"   class="btn"><span class="ico">🧭</span>Naviger</button>
          <button id="act_block" class="btn"><span class="ico">⛔</span>Ikke mulig</button>

          <!-- Nederst: to knapper ved siden av hverandre -->
          <button id="btnBroytKart" class="btn"
                  onclick="window.open('tools/kart.html#addrBin=68ed425cae596e708f11d25f&routeBin=68ed425cae596e708f11d25f&field=geojsonRoutes','_blank')">
            <span class="ico">🚜</span>Brøytekart
          </button>
          <button id="act_incident" class="btn btn-danger">
            <span class="ico">⚠️</span>Uhell
          </button>
        </div>
      </div>
    </section>

    <!-- STATUS -->
    <section id="status" hidden>
      <h1>Status</h1>
      <div id="status_content">…</div>
    </section>

    <!-- SERVICE (ingen auto-nedlasting) -->
    <section id="service" hidden>
      <h1>Service</h1>
      <!-- ditt tidligere innhold her, vi lar være i fred -->
      <div class="card work-card" id="svc_card">
        <div class="label-muted">Rapport</div>
        <div id="svc_status" class="addr-next" style="margin-top:6px;">–</div>

        <!-- bruk denne til å LAGRE til JSONBin; nedlasting kun via verktøylinja som Service.js appender -->
        <div class="btn-grid" style="margin-top:14px;">
          <button id="svc_generate" class="btn">Generer rapport nå</button>
        </div>
      </div>
      <!-- Service.js legger selv til en verktøylinje med: Lagre til JSONBin / Last ned PDF / Last ned JSON -->
    </section>

    <!-- RAPPORTER (ny) -->
    <section id="reports" hidden>
      <h1>Rapporter</h1>

      <div class="rep-filters">
        <select id="rep_f_driver"><option value="">Alle sjåfører</option></select>
        <select id="rep_f_lane">
          <option value="">Begge spor</option>
          <option value="snow">Snø</option>
          <option value="grit">Grus</option>
        </select>
        <input id="rep_f_from" type="date">
        <input id="rep_f_to" type="date">
        <button id="rep_load" class="btn">Hent</button>
      </div>

      <div id="rep_status" class="muted" style="margin:6px 0 10px;">–</div>

      <div id="rep_summary" class="rep-kpis"></div>

      <table id="rep_table" class="rep-table">
        <thead id="rep_thead"></thead>
        <tbody id="rep_tbody"></tbody>
      </table>

      <div id="rep_details" style="margin-top:14px;"></div>

      <div style="margin-top:12px;">
        <button id="rep_reset" class="btn">Nullstill filtre</button>
      </div>
    </section>

    <!-- ADMIN -->
    <section id="admin" hidden>
      <h1>Admin</h1>
      <!-- … din eksisterende admin … -->
    </section>

  </main>

  <!-- Libs (hvis du vil kunne laste ned PDF manuelt fra Service): -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <!-- App core / data -->
  <script src="js/sync.js" defer></script>
  <script src="js/logging.js" defer></script>

  <!-- Sider -->
  <script src="js/Home.js" defer></script>
  <script src="js/Work.js" defer></script>

  <!-- Spor rundestart/-slutt (uten å endre Work.js) -->
  <script src="js/run_track.js" defer></script>

  <!-- Service (ingen auto – bare knapper) -->
  <script src="js/Service.js" defer></script>

  <!-- Rapporter-visning -->
  <script src="js/reports_view.js" defer></script>

  <!-- Resten (om du bruker dem) -->
  <script src="js/Status.js" defer></script>
  <script src="js/Admin.js" defer></script>

  <script>
    // Enkel router – vis aktiv seksjon basert på hash
    function showByHash(){
      const h = location.hash || '#home';
      document.querySelectorAll('main > section').forEach(sec => sec.hidden = true);
      const el = document.querySelector(h);
      if (el) el.hidden = false;
    }
    window.addEventListener('hashchange', showByHash);
    document.addEventListener('DOMContentLoaded', showByHash);

    // Uhell-knappen navigerer til service og forhåndsvelger type
    document.addEventListener('DOMContentLoaded', () => {
      const inc = document.getElementById('act_incident');
      if (inc && !inc.dataset.wired) {
        inc.dataset.wired = '1';
        inc.addEventListener('click', () => {
          try { sessionStorage.setItem('SERVICE_PRESELECT', JSON.stringify({ type: 'incident' })); } catch(_){}
          location.hash = '#service';
        });
      }
    });
  </script>
</body>
</html>

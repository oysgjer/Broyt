<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#0b1320">
  <title>Brøyterute<br>Romerike Trefelling</title>

  <link rel="manifest" href="/manifest.json?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=3">
  <meta name="apple-mobile-web-app-title" content="Brøyterute">

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/work.css" />
  <link rel="stylesheet" href="css/service.css" />
  <link rel="stylesheet" href="css/wx_fix.css" />
</head>

<body>
<header class="appbar">
  <button id="btnMenu" class="icon-btn" aria-label="Meny">≡</button>
  <div class="appbar-title">Brøyterute<br>Romerike&nbsp;Trefelling</div>
  <div class="appbar-right">
    <span id="sync_badge" class="badge">
      <span id="sync_dot" class="dot dot-unknown"></span> Synk: ukjent
    </span>
  </div>
</header>

<!-- Drawer -->
<aside id="drawer" class="drawer">
  <div class="drawer-header">
    <strong>Brøyte meny</strong>
    <button id="btnCloseDrawer" class="icon-btn" aria-label="Lukk">×</button>
  </div>

  <div class="drawer-content">
    <ul class="drawer-list">
      <li><a class="drawer-link" data-go="home">🏠 Hjem</a></li>
      <li><a class="drawer-link" data-go="work">🧭 Under arbeid</a></li>
      <li><a class="drawer-link" data-go="service">🛠️ Service</a></li>
      <li><a class="drawer-link" data-go="status">📊 Status</a></li>
      <li><a class="drawer-link" data-go="admin">⚙️ Admin</a></li>
    </ul>
  </div>
</aside>

<main>
  <!-- HJEM -->
  <section id="home">
    <h1 hidden>Hjem</h1>
    <label class="field">
      <span>Fører</span>
      <input id="a_driver" class="input" placeholder="Navn" />
    </label>

    <label class="field">
      <span>Utstyr</span>
      <div class="checkbox-col">
        <label><input id="a_eq_plow" type="checkbox" /> Skjær</label>
        <label><input id="a_eq_fres" type="checkbox" /> Fres</label>
        <label><input id="a_eq_sand" type="checkbox" /> Sand/Grus</label>
      </div>
    </label>

    <button id="a_start" class="btn">Start runde</button>
  </section>

  <!-- UNDER ARBEID -->
  <section id="work">
    <h1 hidden>Under arbeid</h1>

    <div class="card work-card">
      <div id="uaWrap">
        <div id="uaBar">
          <div id="uaMine"></div>
          <div id="uaRest"></div>
          <div id="uaOthers"></div>
        </div>
        <div id="uaCounts">
          <span class="left">0 mine • 0 andre</span>
          <span class="right">0 av 0 adresser fullført</span>
        </div>
      </div>

      <div class="label-muted">Nå</div>
      <div id="b_now" class="addr-now">—</div>

      <div class="label-muted" style="margin-top:14px">Neste</div>
      <div id="b_next" class="addr-next">—</div>

      <div class="btn-grid">
        <button id="act_start" class="btn btn-ok">▶️ Start</button>
        <button id="act_done"  class="btn btn-dark">✅ Ferdig</button>
        <button id="act_skip"  class="btn">⏭️ Hopp over</button>
        <button id="act_next"  class="btn">➜ Neste</button>
        <button id="act_nav"   class="btn">🧭 Naviger</button>
        <button id="act_block" class="btn">⛔ Ikke mulig</button>
        <button id="btnBroytKart" class="btn">🚜 Brøytekart</button>
        <button id="act_incident" class="btn btn-danger">⚠️ Uhell</button>
      </div>

      <div class="work-meta">
        Oppgave: <span id="b_task">—</span> • Status: <span id="b_status">—</span>
      </div>

      <iframe
        src="https://www.yr.no/nb/innhold/1-103366/card.html"
        title="Vær fra Yr"
        loading="lazy"
        style="border:0; width:100%; height:180px; border-radius:12px;">
      </iframe>
    </div>
  </section>

  <!-- STATUS / SERVICE / ADMIN -->
  <section id="status" hidden><h1>Status</h1></section>
  <section id="service" hidden><h1>Service</h1></section>
  <section id="admin" hidden><h1>Admin</h1></section>
</main>

<!-- ===== STATUSBAR CSS ===== -->
<style>
  #uaWrap{margin:12px 0 14px}
  #uaBar{
    display:flex; height:14px; border-radius:999px; overflow:hidden;
    border:1px solid var(--sep,#e5e7eb); background:#eef1f5;
  }
  #uaMine{background:#16a34a}
  #uaOthers{background:#7c3aed}
  #uaRest{background:transparent}
  #uaCounts{
    display:flex; align-items:center; justify-content:space-between;
    font-size:13px; margin-top:6px; opacity:.9;
  }
</style>

<!-- ===== STATUSBAR JS ===== -->
<script>
function getCurrentDriverId(){
  return (
    window.currentDriverId || window.driverId ||
    localStorage.getItem('driverId') ||
    localStorage.getItem('driverName') ||
    document.getElementById('a_driver')?.value || ''
  ).toString().trim();
}
function getTaskMode(){
  const sand=document.getElementById('a_eq_sand');
  return sand && sand.checked?'grus':'sno';
}
function isDone(v){return !!v && v!=='—' && v!=='0' && v.trim()!=='';}

function computeUAProgress(){
  const mode=getTaskMode();
  const driver=getCurrentDriverId();
  const addresses=window.addresses||[];
  const reports=window.reports||[];
  const total=addresses.length;
  if(!total)return{mine:0,others:0,rest:0,total:0};

  const mineSet=new Set(),otherSet=new Set();

  // 1) Les ut fra Status-data dersom tilgjengelig
  const tbody=document.getElementById('st_tbody');
  if(tbody){
    const rows=tbody.querySelectorAll('tr');
    rows.forEach(r=>{
      const tds=r.querySelectorAll('td');
      const addrName=(tds[0]?.textContent||'').trim();
      const ferdigSno =(tds[2]?.textContent||'').trim();
      const ferdigGrus=(tds[4]?.textContent||'').trim();
      const ferdig = (mode==='sno'?isDone(ferdigSno):isDone(ferdigGrus));
      if(!ferdig)return;
      // Finn hvem (fra rapportene)
      const rep=reports.find(x=>x.addrName===addrName||x.address===addrName);
      const id=(rep?.driverId||rep?.driver||'').toString();
      if(id===driver)mineSet.add(addrName); else otherSet.add(addrName);
    });
  }

  // 2) fallback hvis status ikke lastet ennå – se i rapporter
  if(!mineSet.size && !otherSet.size){
    for(const r of reports){
      const done=isDone(r.ferdigSno)||isDone(r.ferdigGrus)||/(done|ferdig|completed)/i.test(r.status||'');
      if(!done)continue;
      const t=(r.task||r.type||'').toLowerCase();
      if(mode==='sno' && !t.includes('snø') && !t.includes('sno') && !t.includes('plow'))continue;
      if(mode==='grus' && !(t.includes('grus')||t.includes('sand')||t.includes('strø')))continue;
      const addr=(r.addrName||r.address||r.addr||'').trim();
      if(!addr)continue;
      const id=(r.driverId||r.driver||'').toString();
      if(id===driver)mineSet.add(addr); else otherSet.add(addr);
    }
  }

  const mine=mineSet.size,others=otherSet.size;
  const done=mine+others,rest=Math.max(0,total-done);
  const minePct=Math.round(100*(mine/total));
  const otherPct=Math.round(100*(others/total));
  const restPct=Math.max(0,100-minePct-otherPct);
  return{mine,others,rest,total,minePct,otherPct,restPct};
}

function renderUAStatus(){
  const {mine,others,rest,total,minePct,otherPct,restPct}=computeUAProgress();
  const elMine=document.getElementById('uaMine');
  const elOthers=document.getElementById('uaOthers');
  const elRest=document.getElementById('uaRest');
  const left=document.querySelector('#uaCounts .left');
  const right=document.querySelector('#uaCounts .right');
  if(!elMine||!elOthers||!elRest)return;
  elMine.style.width=minePct+'%';
  elOthers.style.width=otherPct+'%';
  elRest.style.width=restPct+'%';
  if(left)left.textContent=`${mine} mine • ${others} andre`;
  if(right)right.textContent=`${mine+others} av ${total} adresser fullført`;
}

window.addEventListener('load',()=>setTimeout(renderUAStatus,1000));
document.addEventListener('app:sync',renderUAStatus);
setInterval(renderUAStatus,3000);
</script>
</body>
</html>

<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root{ --sep:#e3e5ea; --surface:#fff; --bg:#f6f7fb; --text:#111 }
    body{background:var(--bg);color:var(--text);font-family:system-ui;margin:0}
    .appbar{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--sep);background:var(--surface);position:sticky;top:0;z-index:10}
    .icon-btn{background:transparent;border:0;font-size:1.3rem;line-height:1;padding:.4rem .6rem;border-radius:8px}
    .icon-btn:active{transform:scale(0.98)}
    .appbar-title{font-weight:600;font-size:1.05rem}
    .wrap{padding:12px}
    label{display:block;margin:.6rem 0 .2rem}
    input{width:100%;padding:.6rem;border:1px solid var(--sep);border-radius:8px}
    .row{display:flex;gap:8px;align-items:center;margin-top:10px}
    .btn{padding:.7rem 1rem;border-radius:10px;border:1px solid var(--sep);background:#3b82f6;color:#fff;font-weight:600}
    .drawer{position:fixed;inset:0 35% 0 0;max-width:320px;background:var(--surface);box-shadow:2px 0 16px rgba(0,0,0,.2);transform:translateX(-100%);transition:transform .2s ease;z-index:20}
    .drawer.open{transform:translateX(0)}
    .drawer-header{padding:12px;border-bottom:1px solid var(--sep);font-weight:600}
    .drawer-list{list-style:none;margin:0;padding:6px 0}
    .drawer-list li a{display:block;padding:10px 12px;text-decoration:none;color:inherit}
    .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:15}
    .drawer-overlay.show{opacity:1;pointer-events:auto}
    .dot{width:10px;height:10px;border-radius:50%;background:#c0c4ce;display:inline-block}
    .dot-on{background:#22c55e}
  </style>
</head>
<body>
  <header class="appbar">
    <button id="hdr_menu" class="icon-btn" aria-label="Meny">☰</button>
    <div class="appbar-title">Admin</div>
    <div style="margin-left:auto"></div>
    <span id="wl_dot" class="dot dot-off" title="Skjermlås"></span>
  </header>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-header">Meny</div>
    <ul class="drawer-list">
      <li><a href="index.html#work">Under arbeid</a></li>
      <li><a href="index.html#service">Service</a></li>
      <li><a href="index.html#status">Status</a></li>
      <li><a href="tools/kart.html">Brøytekart</a></li>
      <li><a href="reports.html">Rapporter</a></li>
      <li><a href="admin.html">Admin</a></li>
      <li><a href="index.html#work">⛽ Diesel</a></li>
      <li><a href="index.html#work">🪵 Grus</a></li>
      <li><a href="index.html#work">🏠 Base</a></li>
    </ul>
  </aside>
  <div id="drawer_overlay" class="drawer-overlay" aria-hidden="true"></div>

  <div class="wrap">
    <h1>JSONBin-oppsett</h1>
    <label for="cfg_bin_drift">JSONBin ID – Drift</label>
    <input id="cfg_bin_drift" type="text" placeholder="f.eks. 68e7b4d2ae596e708f0bde7d">

    <label for="cfg_bin_report">JSONBin ID – Rapporter</label>
    <input id="cfg_bin_report" type="text" placeholder="f.eks. 68e89e3443b1c97be9611c48">

    <label for="cfg_master_key">JSONBin Master Key</label>
    <input id="cfg_master_key" type="password" placeholder="lim inn master key">

    <div class="row">
      <button id="admin_save_bins" class="btn">Lagre</button>
      <span id="admin_msg"></span>
    </div>
  </div>

  <script>
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('drawer_overlay');
    document.getElementById('hdr_menu').addEventListener('click', ()=>{ drawer.classList.add('open'); overlay.classList.add('show'); });
    overlay.addEventListener('click', ()=>{ drawer.classList.remove('open'); overlay.classList.remove('show'); });
  </script>
  <script src="js/Admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>


<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Admin</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="appbar">
    <button id="hdr_menu" class="icon-btn" aria-label="Meny">☰</button>
    <div class="appbar-title">Admin</div>
  </header>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-header">Meny</div>
    <ul class="drawer-list">
      <li><a href="index.html#work">Under arbeid</a></li>
      <li><a href="index.html#service">Service</a></li>
      <li><a href="index.html#status">Status</a></li>
      <li><a href="tools/kart.html">Brøytekart</a></li>
      <li><a href="reports.html">Rapporter</a></li>
      <li><a href="admin.html">Admin</a></li>
      <li><a href="index.html#work" data-shortcut="diesel">⛽ Diesel</a></li>
      <li><a href="index.html#work" data-shortcut="grus">🪨 Grus</a></li>
      <li><a href="index.html#work" data-shortcut="base">🏠 Base</a></li>
    </ul>
  </aside>
  <div id="drawer_overlay" class="drawer-overlay" aria-hidden="true"></div>

  <main class="wrap">
    <h1>Oppsett</h1>
    <label for="cfg_bin_drift">JSONBin ID – Drift</label>
    <input id="cfg_bin_drift" type="text">
    <label for="cfg_bin_report">JSONBin ID – Rapporter</label>
    <input id="cfg_bin_report" type="text">
    <label for="cfg_master_key">JSONBin Master Key</label>
    <input id="cfg_master_key" type="password">
    <div class="spacer"></div>
    <button id="admin_save_bins" class="btn btn-primary">Lagre</button>

    <hr>
    <h2>Destinasjoner (snarveier)</h2>
    <p>Fyll inn lat/lon for nøyaktig navigering. Hvis tomt, brukes Spørring.</p>

    <h3>⛽ Diesel</h3>
    <label>Navn</label><input id="ns_diesel_name" type="text">
    <label>Spørring</label><input id="ns_diesel_query" type="text">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="ns_diesel_lat" type="number" step="any" placeholder="lat" style="flex:1">
      <input id="ns_diesel_lon" type="number" step="any" placeholder="lon" style="flex:1">
    </div>

    <h3>🪨 Grus</h3>
    <label>Navn</label><input id="ns_grus_name" type="text">
    <label>Spørring</label><input id="ns_grus_query" type="text">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="ns_grus_lat" type="number" step="any" placeholder="lat" style="flex:1">
      <input id="ns_grus_lon" type="number" step="any" placeholder="lon" style="flex:1">
    </div>

    <h3>🏠 Base</h3>
    <label>Navn</label><input id="ns_base_name" type="text">
    <label>Spørring</label><input id="ns_base_query" type="text">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="ns_base_lat" type="number" step="any" placeholder="lat" style="flex:1">
      <input id="ns_base_lon" type="number" step="any" placeholder="lon" style="flex:1">
    </div>

    <hr>
    <h2>Adresse-register</h2>
    <div class="spacer"></div>
    <div class="grid2">
      <button id="addr_reload" class="btn">Last fra sky</button>
      <button id="addr_add" class="btn">Ny adresse</button>
    </div>
    <div class="spacer"></div>
    <button id="addr_save_all" class="btn btn-primary">Lagre alle</button>

    <div id="addr_list" class="spacer"></div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/nav-shortcuts.js"></script>
  <script src="js/admin-navshortcuts.js"></script>
  <script src="js/Admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

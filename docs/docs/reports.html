<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rapporter</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
    .filters .field{min-width:160px}
    .filters .actions{display:flex;gap:8px;align-items:flex-end}
    .tbl{width:100%;border-collapse:collapse}
    .tbl th,.tbl td{padding:8px;border-bottom:1px solid var(--border,#e5e7eb);text-align:left}
    @media print{ .filters, #summary, #exportBtns, .appbar, .drawer, .drawer-toggle { display:none !important } }
  </style>
</head>
<body>
  <div data-include="partials/header.html"></div>
  <main class="container">
    <h1>Rapporter (logg)</h1>
    <div id="summary" class="card">Laster…</div>

    <div class="card">
      <h2 style="margin:0 0 6px">Filter</h2>
      <div class="filters">
        <label class="field">Fra <input id="f_from" type="date" class="input"></label>
        <label class="field">Til <input id="f_to" type="date" class="input"></label>
        <label class="field">Sjåfør
          <select id="f_driver" class="input"><option value="">Alle</option></select>
        </label>
        <label class="field" style="flex:1 1 280px">Adresse/område
          <input id="f_addr" type="text" class="input" placeholder="Søk i adresse/notat...">
        </label>
        <label class="field">Hendelser
          <select id="f_action" class="input">
            <option value="">Alle</option>
            <option value="start">Start</option>
            <option value="ferdig">Ferdig</option>
            <option value="neste">Neste</option>
            <option value="hopp_over">Hopp over</option>
            <option value="ikke_mulig">Ikke mulig</option>
          </select>
        </label>
        <div class="actions">
          <button id="btnApply" class="btn">🔍 Filtrer</button>
          <button id="btnReset" class="btn-ghost">↺ Nullstill</button>
        </div>
      </div>
      <div id="exportBtns" class="actions" style="margin-top:6px">
        <button id="btnExportCsv" class="btn-ghost">⬇️ Eksporter CSV</button>
        <button id="btnPrint" class="btn-ghost">🧾 Skriv ut (PDF)</button>
      </div>
    </div>

    <div id="tableWrap" class="card" style="padding:0;overflow:auto;"></div>

    <section id="printSheet" class="card" style="display:none">
      <h1>Rapporter / logg</h1>
      <div id="printMeta" class="muted" style="margin-bottom:8px"></div>
      <div id="printTable"></div>
      <div style="margin-top:8px">Brøyting Romerike Trefelling</div>
    </section>
  </main>

  <div data-include="partials/menu.html"></div>

  <script src="js/include-partials.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/app.js"></script>
  <script src="js/Reports.js?v=log2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KartTegner – Brøyterute</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b1320;
      color: #fff;
    }
    #app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; overflow: hidden; }

    header {
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
    }
    .brand { display:flex; align-items:center; gap:.6rem; }
    .hamburger {
      width: 38px; height: 38px; border:1px solid #334155;
      border-radius:10px; display:grid; place-items:center;
      background:#1e293b; cursor:pointer;
    }
    .hamburger div { width:18px; height:2px; background:#fff; position:relative; }
    .hamburger div::before, .hamburger div::after {
      content:""; position:absolute; width:18px; height:2px; background:#fff;
    }
    .hamburger div::before{ top:-6px; } .hamburger div::after{ top:6px; }

    .btn { background:#1e293b; border:1px solid #334155; border-radius:10px;
      color:#fff; padding:.6rem .9rem; cursor:pointer; font-size:.95rem; }
    .btn.active { outline:2px solid #16a34a; }

    #map { height: 100%; width: 100%; background:#000; }

    #statusbar {
      background:#0b1320; border-top:1px solid #1f2937;
      padding:8px 12px; display:grid; gap:.5rem;
    }
    .progress { height:12px; background:#475569; border-radius:999px; overflow:hidden; }
    .progress div { height:100%; background:#16a34a; width:0%; transition:width .3s; }

    .pill { background:#1f2937; border:1px solid #334155; border-radius:999px;
      padding:.3rem .7rem; font-size:.9rem; }

    .legend {
      position:fixed; right:12px; top:64px;
      background:#fff; color:#111; border:1px solid #e5e7eb;
      border-radius:10px; padding:.6rem; font-size:.9rem; z-index:800;
    }
    .legend h3{ margin:0 0 .4rem 0; font-size:.95rem; }
    .row{ display:flex; align-items:center; gap:.4rem; margin:.2rem 0; }
    .swatch{ width:10px; height:10px; border-radius:2px; display:inline-block; }
    .swatch.route{ background:#ef4444; }
    .swatch.covered{ background:#16a34a; }
    .swatch.others{ background:#8b5cf6; }
    .swatch.gps{ background:#3b82f6; }

    /* Modal (ruteliste) */
    .modal { position:fixed; inset:0; display:none; z-index:5000; }
    .modal.show { display:block; }
    .shade { position:absolute; inset:0; background:rgba(0,0,0,.4); }
    .panel {
      position:absolute; left:50%; top:10vh; transform:translateX(-50%);
      width:min(92vw,720px); max-height:80vh; overflow:auto;
      background:#fff; color:#111; border:1px solid #e5e7eb;
      border-radius:12px; padding:12px;
    }
    .panel strong { font-size:1.1rem; }
    .route-item { border:1px solid #e5e7eb; border-radius:10px; padding:.5rem;
      display:flex; justify-content:space-between; align-items:center; }
  </style>
</head>

<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="hamburger" id="btnMenu"><div></div></div>
      <h1>KartTegner</h1>
    </div>
    <button class="btn active" id="btnFollow">📍 Sentrer (på)</button>
  </header>

  <div id="map"></div>

  <div id="statusbar">
    <div class="progress"><div id="bar"></div></div>
    <div style="display:flex; gap:.5rem; flex-wrap:wrap;">
      <span class="pill" id="coverage">Dekning: 0%</span>
      <span class="pill" id="distance">Rutelengde: 0 m</span>
      <span class="pill" id="fix">GPS: –</span>
    </div>
  </div>
</div>

<div class="legend">
  <h3>Tegnforklaring</h3>
  <div class="row"><span class="swatch route"></span>Rute(r)</div>
  <div class="row"><span class="swatch covered"></span>Dekket (deg)</div>
  <div class="row"><span class="swatch others"></span>Dekket (andre)</div>
  <div class="row"><span class="swatch gps"></span>GPS-spor</div>
</div>

<!-- Modal for ruteliste -->
<div class="modal" id="routeModal">
  <div class="shade" id="routeShade"></div>
  <div class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <strong>Ruteliste</strong>
      <button class="btn" id="btnCloseRouteModal">Lukk</button>
    </div>
    <div id="routesContainer" style="margin-top:.6rem; display:grid; gap:.4rem;"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

<script>
(function(){
  const map = L.map('map').setView([60.2563,11.1941],14);
  const light = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19});
  const dark  = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19});
  light.addTo(map);  // fallback – vis alltid kart

  const drawnLayer = new L.FeatureGroup().addTo(map);
  const gpsLayer   = new L.FeatureGroup().addTo(map);

  let follow = true;
  const btnFollow=document.getElementById('btnFollow');
  btnFollow.onclick=()=>{follow=!follow;btnFollow.classList.toggle('active',follow);btnFollow.textContent=follow?'📍 Sentrer (på)':'📍 Sentrer (av)';};

  let watchId=null;
  let gpsLine=null;
  let gpsPoints=[];
  let dot=null;
  function addGps(lat,lon,acc){
    const latlng=[lat,lon];
    gpsPoints.push(latlng);
    if(!gpsLine) gpsLine=L.polyline(gpsPoints,{color:'#3b82f6',weight:3}).addTo(gpsLayer);
    else gpsLine.setLatLngs(gpsPoints);
    if(!dot) dot=L.circleMarker(latlng,{radius:5,color:'#1d4ed8',fillColor:'#1d4ed8',fillOpacity:1}).addTo(gpsLayer);
    else dot.setLatLng(latlng);
    document.getElementById('fix').textContent='GPS: '+Math.round(acc)+'m';
    if(follow) map.setView(latlng,Math.max(map.getZoom(),16));
  }

  function startGPS(){
    if(watchId) return;
    if(!navigator.geolocation){alert('Ingen GPS');return;}
    watchId=navigator.geolocation.watchPosition(
      pos=>addGps(pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy),
      err=>console.warn(err),
      {enableHighAccuracy:true,timeout:8000}
    );
  }
  function stopGPS(){if(watchId){navigator.geolocation.clearWatch(watchId);watchId=null;}}

  async function tryAutoGPS(){
    try{
      const st=await navigator.permissions.query({name:'geolocation'});
      if(st.state==='granted') startGPS();
      else if(st.state==='prompt') navigator.geolocation.getCurrentPosition(()=>startGPS(),()=>{});
    }catch{startGPS();}
  }

  // WakeLock
  let wl=null;
  async function acquireWL(){try{wl=await navigator.wakeLock.request('screen');}catch{}}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')acquireWL();});
  window.addEventListener('pageshow',()=>{acquireWL();tryAutoGPS();});
  window.addEventListener('pagehide',()=>stopGPS());

  // Ruteliste (tom for nå)
  const modal=document.getElementById('routeModal');
  const shade=document.getElementById('routeShade');
  document.getElementById('btnCloseRouteModal').onclick=()=>modal.classList.remove('show');
  shade.onclick=()=>modal.classList.remove('show');
  document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('show');});

  // Test-knapp: åpne med langtrykk på "Sentrer"
  btnFollow.addEventListener('contextmenu',e=>{e.preventDefault();modal.classList.add('show');});

  // auto kjør ved oppstart
  acquireWL();
  tryAutoGPS();
})();
</script>
</body>
</html>


<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Brøytekart</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    html,body,#map{height:100%;margin:0}
    .toolbar{position:fixed;left:10px;right:10px;bottom:10px;display:flex;gap:10px;z-index:1000}
    .btn{flex:1;padding:12px;border-radius:10px;border:0;background:#111;color:#fff;font-weight:700}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="toolbar">
    <button id="follow" class="btn">Sentrer & følg</button>
    <a class="btn" href="../index.html#work">Tilbake</a>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

    let watchId = null;
    let marker = null;

    function onPos(p){
      const { latitude:lat, longitude:lon } = p.coords;
      const latlng = [lat,lon];
      if (!marker){
        marker = L.circleMarker(latlng, { radius:6, color:'#1976d2', weight:2, fillColor:'#2196f3', fillOpacity:1 }).addTo(map);
        map.setView(latlng, 16);
      }else{
        marker.setLatLng(latlng);
      }
    }
    function onErr(e){ console.warn('geo', e); }
    function startFollow(){
      if (watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
      watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy:true, maximumAge:2000, timeout:10000 });
    }
    document.getElementById('follow').addEventListener('click', startFollow);

    // Initial one-shot locate for a good start
    navigator.geolocation.getCurrentPosition(p=>{
      onPos(p);
      map.setView([p.coords.latitude, p.coords.longitude], 16);
    }, onErr, { enableHighAccuracy:true, timeout:8000 });
  </script>
</body>
</html>
